[package]
name = "cider-cli"
version = "0.7.0"
edition = "2021"
description = "Manage macOS Apple apps from the command line — Reminders, Calendar, Contacts, Notes, Mail, Music, Keychain, Safari, and 30+ more"
license = "MIT"
repository = "https://github.com/thrashr888/cider"
homepage = "https://github.com/thrashr888/cider"
readme = "README.md"
keywords = ["macos", "apple", "cli", "automation", "keychain"]
categories = ["command-line-utilities", "os::macos-apis"]
rust-version = "1.70"

[lib]
name = "cider"
path = "src/lib.rs"

[[bin]]
name = "cider"
path = "src/main.rs"
required-features = ["cli"]

[features]
# The Clap front-end and its `--pretty` tables. On by default so `cargo
# install cider-cli` and `cargo build` still produce the binary; a library
# consumer turns it off (`default-features = false`) and compiles neither an
# argument parser nor a table renderer it will never call.
default = ["cli", "mcp"]
cli = ["dep:clap"]
# Optional transport adapter; library consumers can omit the MCP SDK entirely.
mcp = ["dep:rmcp", "dep:schemars"]

[dependencies]
anyhow = "1"
crc32fast = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"], optional = true }
log = "0.4"
notify = "6"
plist = "1"
rmcp = { version = "3.4", default-features = false, features = ["server", "transport-io"], optional = true }
schemars = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
