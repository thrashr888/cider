<!doctype html>
<html><head><meta charset="utf-8">
<style>/*STYLE*/
.head { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
.list { max-height: 360px; overflow: auto; }
.e { display: grid; grid-template-columns: 62px 1fr; gap: 2px 10px; padding: 5px 0; border-bottom: 1px solid var(--line); }
.e:last-child { border-bottom: 0; }
.t { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 1px; }
.p { font-weight: 600; font-size: 12px; }
.lvl { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; margin-left: 6px; color: var(--muted); }
.lvl.error { color: var(--red); } .lvl.fault { color: var(--red); font-weight: 700; } .lvl.default, .lvl.info, .lvl.debug { color: var(--muted); }
.m { grid-column: 2; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11.5px; white-space: pre-wrap; overflow-wrap: anywhere;
  max-height: 4.4em; overflow: hidden; }
</style></head>
<body><div id="app" class="muted">Loading…</div>
<script>/*BRIDGE*/</script>
<script>
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
// "2026-10-21 09:14:03.123456-0700" → "09:14:03"
const clock = (ts) => (String(ts ?? "").match(/\d{2}:\d{2}:\d{2}/) ?? [""])[0];
function render(result, host) {
  const app = document.getElementById("app");
  const out = result.structuredContent ?? {};
  if (!out.ok) { app.innerHTML = `<span class="error">${esc(out.error?.message || "No log entries")}</span>`; return; }
  const d = out.data ?? {};
  const entries = d.entries ?? [];
  const what = [d.level === "all" ? "Log" : "Errors and faults", d.process && `from ${d.process}`, d.search && `matching “${d.search}”`, `· last ${d.minutes} min`]
    .filter(Boolean).join(" ");
  app.className = "";
  if (!entries.length) { app.innerHTML = `<div class="head">${esc(what)}</div><div class="muted">Nothing logged.</div>`; return; }
  app.innerHTML = `<div class="head">${esc(what)} · ${entries.length}</div><div class="list">${entries.map((e) => {
    const lvl = String(e.level ?? "").toLowerCase();
    return `<div class="e"><div class="t">${esc(clock(e.timestamp))}</div>
      <div><span class="p">${esc(e.process || "?")}</span>${lvl ? `<span class="lvl ${esc(lvl)}">${esc(lvl)}</span>` : ""}</div>
      <div class="m" title="${esc(e.message)}">${esc(e.message)}</div></div>`;
  }).join("")}</div>`;
  const list = app.querySelector(".list");
  list.scrollTop = list.scrollHeight; // newest last, like Console
}
</script></body></html>
