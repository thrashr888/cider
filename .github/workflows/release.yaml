name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../cider-${{ matrix.target }}.tar.gz cider
      - uses: actions/upload-artifact@v4
        with:
          name: cider-${{ matrix.target }}
          path: cider-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      # This repo has GitHub's immutable releases enabled, so a release is
      # frozen the moment it is published — assets can only be attached while
      # it is still a draft, and a published one can't even be reverted to
      # draft to fix it. v0.2.0 shipped binary-less that way. The release must
      # therefore be created as a draft (see AGENTS.md), stay one while the
      # tarballs upload, and be published here as the last step.
      #
      # No generate_release_notes: the draft is created with its notes already
      # written, and regenerating would overwrite them.
      - uses: softprops/action-gh-release@v2
        with:
          files: cider-*.tar.gz
          draft: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" --draft=false

  crates-io:
    needs: build
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish || echo "Version already published — skipping"

  homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Compute SHA256 sums
        id: sha
        run: |
          echo "darwin_arm64=$(sha256sum cider-aarch64-apple-darwin.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "darwin_amd64=$(sha256sum cider-x86_64-apple-darwin.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      # The Swift bridge (Cider Bridge.app + cider-bridge, Developer ID,
      # notarized) cannot be built here: it needs the Developer ID certificate
      # and the notarytool credentials. bridge/scripts/release.md builds it on
      # a Mac and uploads it onto the draft release before the tag is created.
      # If it is there, the formula installs it; if not, the formula omits it.
      - name: Look for the packaged bridge on the release
        id: bridge
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          NAME="cider-bridge-${TAG#v}-macos-universal.tar.gz"
          if gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' | grep -qx "$NAME"; then
            gh release download "$TAG" --repo "$REPO" --pattern "$NAME"
            echo "url=https://github.com/$REPO/releases/download/$TAG/$NAME" >> "$GITHUB_OUTPUT"
            echo "sha256=$(sha256sum "$NAME" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
            echo "bridge asset found: $NAME"
          else
            echo "url=" >> "$GITHUB_OUTPUT"
            echo "sha256=" >> "$GITHUB_OUTPUT"
            echo "no $NAME on the release; the formula will omit the bridge"
          fi
      - name: Update Homebrew formula
        uses: thrashr888/homebrew-tap@main
        with:
          formula: cider
          tag: ${{ github.ref_name }}
          tap-token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          darwin-arm64-sha256: ${{ steps.sha.outputs.darwin_arm64 }}
          darwin-amd64-sha256: ${{ steps.sha.outputs.darwin_amd64 }}
          bridge-url: ${{ steps.bridge.outputs.url }}
          bridge-sha256: ${{ steps.bridge.outputs.sha256 }}
          # ${BRIDGE_RESOURCE}, ${BRIDGE_INSTALL} and ${BRIDGE_CAVEATS} are
          # filled by the action when bridge-url/bridge-sha256 are set and
          # removed otherwise; bridge/scripts/formula-example.rb shows the
          # filled-in result.
          template: |
            class Cider < Formula
              desc "Manage macOS Apple apps from the command line"
              homepage "https://github.com/thrashr888/cider"
              version "${VERSION}"
              license "MIT"

              on_macos do
                if Hardware::CPU.arm?
                  url "https://github.com/thrashr888/cider/releases/download/${TAG}/cider-aarch64-apple-darwin.tar.gz"
                  sha256 "${SHA_DARWIN_ARM64}"
                else
                  url "https://github.com/thrashr888/cider/releases/download/${TAG}/cider-x86_64-apple-darwin.tar.gz"
                  sha256 "${SHA_DARWIN_AMD64}"
                end
              end

            ${BRIDGE_RESOURCE}
              def install
                bin.install "cider"
            ${BRIDGE_INSTALL}
              end

            ${BRIDGE_CAVEATS}
              test do
                assert_match "cider", shell_output("#{bin}/cider --help")
              end
            end
