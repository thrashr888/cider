name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy -- -D warnings
      # Build the way a library consumer does. Alchemy links this crate with
      # default-features off, so a Clap import creeping into src/sources/ would
      # break it — and would pass every check above, which all build the binary.
      - name: Clippy (library only, no Clap)
        run: cargo clippy --lib --no-default-features -- -D warnings
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build --release

  # The Swift bridge: the package (BridgeCore + cider-bridge CLI) with its
  # tests, then the Catalyst app unsigned. No team, no entitlements, no live
  # stores — signing and HomeKit are a personal-build concern (bridge/scripts).
  # cargo publish verifies the crate by building it on the publish runner,
  # which is Linux. Catch macOS-only code before a tag does.
  linux-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check the crate builds on Linux
        run: cargo check --all-targets
      - name: Dry-run the publish
        run: cargo publish --dry-run

  bridge:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      # The package is swift-tools 6.0 and the app targets the iOS 17 /
      # macOS 14 SDKs; any Xcode >= 16 builds it. Pick the newest one on the
      # runner so a beta-era API (developed against Xcode 27) is not missed
      # by an older default. Override with DEVELOPER_DIR if a pin is needed.
      - name: Select the newest Xcode on the runner
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          echo "using $XCODE"
          "$XCODE/Contents/Developer/usr/bin/xcodebuild" -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Swift build
        run: swift build
      - name: Swift test
        run: swift test
      - name: Catalyst app (unsigned)
        run: |
          xcodegen generate
          xcodebuild \
            -project CiderBridge.xcodeproj \
            -scheme CiderBridge \
            -destination 'platform=macOS,variant=Mac Catalyst' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            -derivedDataPath .build/DerivedData \
            build | tail -40
          test "${PIPESTATUS[0]}" -eq 0
